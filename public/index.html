<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ClipBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>ClipBridge</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">连接中</span>
      </div>
    </header>

    <div class="card">
      <div class="qr-head">
        <p class="hint">扫码或复制网址，让别人打开同一页面</p>
        <button class="link-btn" id="toggleQr" type="button">显示二维码</button>
      </div>
      <div class="qr-body" id="qrBody" hidden>
        <img id="qrImg" alt="扫码打开" hidden>
        <p class="url-text" id="pageUrl">加载中…</p>
        <button class="secondary" id="copyUrlBtn" type="button">复制网址</button>
      </div>
    </div>

    <div class="card">
      <textarea id="text" placeholder="输入或粘贴，自动同步到所有设备…" spellcheck="false"></textarea>
      <button id="copyBtn" type="button">复制到本机</button>
      <button class="secondary" id="clearBtn" type="button">清空</button>
      <p class="hint">输入即同步。收到内容后点「复制到本机」写入剪贴板。</p>
    </div>

    <div class="card">
      <div class="qr-head">
        <p class="hint" id="fileHint">文件传输 · 照片/文档 · 流式落盘不占内存</p>
      </div>
      <input type="file" id="fileInput" hidden>
      <div class="drop-zone" id="dropZone">
        <p>拖拽文件到此处上传</p>
        <p class="drop-hint">或点击下方按钮选择</p>
      </div>
      <button id="uploadBtn" type="button">选择文件上传</button>
      <ul class="files" id="files"></ul>
    </div>

    <div class="card">
      <div class="qr-head">
        <p class="hint" id="historyHint">最近 10 条（点「复制」写入本机剪贴板）</p>
        <button class="link-btn" id="clearHistBtn" type="button">清空历史</button>
      </div>
      <ul class="history" id="history"></ul>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
